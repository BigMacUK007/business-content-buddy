services:
  - type: web
    name: business-content-buddy
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: business-content-buddy-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: business-content-buddy-db
    plan: free
    databaseName: business_content_buddy
    user: business_content_buddy

